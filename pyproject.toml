[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sei-slm"
version = "0.1.0"
description = "Security Event Intelligence SLM — structured SOC triage (disposition → ATT&CK → severity → evidence → action)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SEI SLM contributors" }]
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "httpx>=0.27",
  "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "transformers>=4.45",
  "peft>=0.13",
  "trl>=0.12",
  "bitsandbytes>=0.44",
  "datasets>=3.0",
  "accelerate>=0.34",
  "sentencepiece",
  "protobuf",
]
serve = ["vllm>=0.6"]
demo = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
sei-train-sft = "sei.train.sft:main"
sei-train-orpo = "sei.train.orpo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
