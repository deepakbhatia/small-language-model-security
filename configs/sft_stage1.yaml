stage: 1
base_model: fdtn-ai/Foundation-Sec-8B
train_file: data/processed/v1/train.jsonl
val_file: data/processed/v1/val.jsonl
output_dir: checkpoints/sei-sft-stage1
# Set when continuing after an earlier stage-1 run (local or pulled from S3):
# resume_adapter: checkpoints/sei-sft-stage1/adapter
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
epochs: 1
batch_size: 2
grad_accum: 8
lr: 1.0e-4
warmup_ratio: 0.03
max_length: 1024
logging_steps: 10
eval_steps: 500
save_steps: 500
dry_run: false
