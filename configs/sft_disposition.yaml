# GUIDE-heavy balanced disposition SFT (hard-neg YAML + stratified GUIDE).
stage: 5
base_model: fdtn-ai/Foundation-Sec-8B
train_file: data/processed/disposition/train.jsonl
val_file: data/processed/disposition/val.jsonl
output_dir: checkpoints/sei-sft-disposition
resume_adapter: checkpoints/sei-sft-ood/adapter
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
epochs: 1
batch_size: 2
grad_accum: 8
lr: 2.0e-5
warmup_ratio: 0.05
max_length: 1536
logging_steps: 10
eval_steps: 200
save_steps: 200
dry_run: false
