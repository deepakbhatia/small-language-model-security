base_model: fdtn-ai/Foundation-Sec-8B
train_file: data/processed/disposition/train.jsonl
preference_file: data/processed/orpo/preferences_disposition.jsonl
output_dir: checkpoints/sei-orpo-disposition
resume_adapter: checkpoints/sei-sft-disposition/adapter
recipes:
  - wrong_disposition
  - always_true_positive
  - ungrounded_evidence
  - strip_evidence
  - wrong_evidence_index
  - over_severity
  - bad_technique
  - action_laundry_list
lora_r: 32
lora_alpha: 64
epochs: 1
batch_size: 1
grad_accum: 16
lr: 5.0e-6
beta: 0.1
max_length: 4096
max_completion_length: 1024
dry_run: false
